<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案件管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --ink:#1E2430; --muted:#687080; --line:#D8DCE2;
  --accent:#5B4FA3; --accent-soft:#ECE9F7; --tt:#1A1823; --tt-title:#A99BE8;
  --amber:#9A6412; --amber-soft:#FBF1DF; --teal:#2F7D6D; --teal-soft:#E2F2EE; --gray-soft:#EDEEF0;
  --danger:#B42318;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{color-scheme:light}
html,body{background:var(--bg)!important;color:var(--ink)}
body{min-height:100vh}
body{font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);height:56px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.02em}
header h1 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px;white-space:nowrap}
@media (max-width:520px){header h1 small{display:none}header h1{white-space:nowrap}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F6F7F9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:#4E4390}
.btn.danger{color:var(--danger);border-color:#F0C9C5}
.btn.small{padding:5px 10px;font-size:13px}
.back{display:none}
.short{display:none}
@media (max-width:520px){header{padding:10px 10px;gap:6px}header .btn{padding:7px 9px}.long{display:none}.short{display:inline}}

.layout{display:block;background:var(--bg);min-height:calc(100vh - 56px)}
.pane{background:var(--bg);color:var(--ink)}
.pane{padding:16px}
body.view-list .pane-right{display:none}
body.view-edit .pane-left, body.view-settings .pane-left, body.view-summary .pane-left, body.view-statement .pane-left{display:none}
body.view-edit .back, body.view-settings .back, body.view-summary .back, body.view-statement .back{display:inline-block}

@media (min-width:900px){
  .layout{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 56px)}
  .pane{overflow:auto;padding:20px}
  .pane-left{border-right:1px solid var(--line);display:block!important}
  body.view-list .pane-right{display:block}
  .back{display:none!important}
}

/* list */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.job{display:grid;grid-template-columns:52px 1fr;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.job:hover{border-color:#B9BEC7}
.job[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.jdate{text-align:center;line-height:1.2}
.jdate b{display:block;font-size:18px}
.jdate span{font-size:12px;color:var(--muted)}
.jdate.none b{font-size:13px;color:var(--muted)}
.jtitle{font-weight:700;line-height:1.4}
.jsub{font-size:13px;color:var(--muted);margin-top:2px}
.jfoot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:700}
.st-未手配{background:var(--amber-soft);color:var(--amber)}
.st-手配済{background:var(--accent-soft);color:var(--accent)}
.st-完了{background:var(--teal-soft);color:var(--teal)}
.st-入金済{background:var(--gray-soft);color:var(--muted)}
.jpay{font-size:13px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:40px 12px}

/* editor */
.editor{max-width:760px}
.ed-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ed-head h2{font-size:18px;margin:0;flex:1;min-width:200px}
.tt{background:var(--tt);color:#EDEBF5;border-radius:14px;padding:16px;margin-bottom:18px}
.tt-label{font-size:12px;color:#9F9BB0;margin-bottom:8px}
.tt-title{color:var(--tt-title);font-weight:700;font-size:17px;line-height:1.45;margin-bottom:10px;word-break:break-all}
.tt-memo{white-space:pre-wrap;font-size:14px;line-height:1.65;border-top:1px solid #2E2B3A;padding-top:10px;min-height:1.6em}
.tt-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tt-actions button{flex:1;min-width:130px;border:0;border-radius:8px;padding:10px;background:#3A3452;color:#fff;font-weight:700;cursor:pointer}
.tt-actions button:hover{background:#4A4268}

section.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
section.box h3{font-size:15px;margin:0 0 4px}
section.box .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#FBFBFC;color:var(--ink);font-size:15px}
label.f [hidden]{display:none!important}
label.f textarea{min-height:72px;resize:vertical;line-height:1.55}

.wrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
@media (min-width:600px){.wrow{grid-template-columns:1.3fr 1fr 1fr auto}}
.wrow .wfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.wrow .wfoot label{display:flex;align-items:center;gap:6px;color:var(--ink)}
.money{font-variant-numeric:tabular-nums}
.money div{display:flex;justify-content:space-between;padding:4px 0}
.money .total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:17px}
.money .neg{color:var(--danger)}
.pdfbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#FBFBFC}
.pdfbox .name{flex:1;min-width:140px;word-break:break-all;font-size:14px}
.filebtn{display:inline-block}
.preset{border-top:1px solid var(--line);padding:12px 0}
.preset:first-of-type{border-top:0;padding-top:0}
.preset-head{display:flex;gap:8px;align-items:center}
.preset-head span{flex:1;font-weight:700}
.preset details{margin-top:6px}
.preset summary{font-size:13px;color:var(--muted);cursor:pointer}
.preset pre{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#FBFBFC;border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 0}
.pset{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.pset .addrow{margin-bottom:8px}
.checks.two{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.checks .private{color:var(--danger)}
.subhead{font-size:12px;color:var(--muted);margin:8px 0 2px}
.sum-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.sum-controls label.chk{display:flex;align-items:center;gap:6px;font-size:14px;padding-bottom:8px}
.wsum{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.wsum:hover{border-color:#B9BEC7}
.wsum b{font-size:16px}
.wsum span{color:var(--muted);font-size:13px}
.srow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;align-items:start}
.srow:first-child{border-top:0}
.srow .d{font-size:14px}
.srow .t{line-height:1.45}
.srow .t small{display:block;color:var(--muted);font-size:12px}
.srow .a{text-align:right;font-weight:700}
.srow .a small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sum-total{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding-top:10px;margin-top:4px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1;min-width:150px;white-space:normal;line-height:1.4}
@media (max-width:520px){.actions{flex-direction:column}.actions .btn{width:100%;padding:11px 12px}}
.linkback{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;margin-bottom:10px;font-size:14px}
.foot-actions{display:flex;gap:8px;justify-content:flex-end;margin:6px 0 40px}

/* settings */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--gray-soft);border-radius:999px;padding:3px 4px 3px 12px;font-size:14px}
.tag button{border:0;background:transparent;cursor:pointer;width:24px;height:24px;border-radius:50%;color:var(--muted)}
.tag button:hover{background:#DADDE2}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#FBFBFC}
.checks label{display:flex;align-items:center;gap:8px;padding:5px 0}
.note{font-size:13px;background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:10px 12px;margin-bottom:14px}

.auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth[hidden]{display:none}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.auth-card h2{margin:0 0 4px;font-size:20px}
.auth-card p{margin:0 0 16px;color:var(--muted);font-size:14px}
.auth-card label.f{margin-bottom:12px}
.auth-card .btn{width:100%;padding:11px}
.auth-msg{color:var(--danger);font-size:14px;margin-top:10px;min-height:1.4em}
.account div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.account span{color:var(--muted)}
.welcome{color:var(--muted);padding:60px 20px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.crow{grid-template-columns:1fr 1fr}
@media (min-width:600px){.crow{grid-template-columns:1.4fr .8fr 1fr auto}}
.sheet-wrap{overflow:hidden;margin-bottom:40px}
.sheet{width:794px;min-height:1000px;background:#fff;color:#111;padding:48px 44px;transform-origin:top left;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:13px;line-height:1.5}
.sh-title{text-align:center;font-size:24px;font-weight:700;letter-spacing:.3em;margin-bottom:28px}
.sh-top{display:flex;justify-content:space-between;gap:24px;margin-bottom:22px}
.sh-left{flex:1}
.sh-to{font-size:19px;font-weight:700;border-bottom:1px solid #111;padding-bottom:4px;margin-bottom:10px;display:inline-block;min-width:240px}
.sh-meta th{text-align:left;font-weight:400;color:#444;padding:2px 14px 2px 0}
.sh-meta td{padding:2px 0}
.sh-amount{display:flex;align-items:baseline;gap:18px;margin-top:14px;border:2px solid #111;padding:8px 14px;width:fit-content}
.sh-amount b{font-size:22px}
.sh-right{text-align:right;font-size:12px;line-height:1.7}
.sh-co{font-size:16px;font-weight:700;margin-top:8px}
.sh-table{width:100%;border-collapse:collapse}
.sh-table th,.sh-table td{border:1px solid #555;padding:6px 8px;vertical-align:top}
.sh-table th{background:#EFEFEF;font-weight:700;font-size:12px}
.sh-table .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-table .r{text-align:right}
.sh-table tfoot td{font-weight:700}
.sh-table small{color:#444}
.sh-misc{margin-top:16px;border:1px solid #555;padding:8px 12px;width:fit-content;min-width:260px}
.sh-misc div{display:flex;justify-content:space-between;gap:20px}
.sh-misc p{margin:4px 0 0;font-size:12px;color:#444}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important}
  header,.pane-left,.toast,.auth,.stmt > *:not(.sheet-wrap){display:none!important}
  .layout{display:block!important;height:auto!important;min-height:0!important;background:#fff!important}
  .pane{padding:0!important;overflow:visible!important;background:#fff!important}
  .sheet-wrap{height:auto!important;overflow:visible!important;margin:0}
  .sheet{transform:none!important;box-shadow:none;width:auto;min-height:0;padding:0}
  .editor{max-width:none!important}
}
</style>
</head>
<body class="view-list">
<header>
  <button class="btn back" id="backBtn" aria-label="一覧へ戻る">‹ 一覧</button>
  <h1>案件管理</h1>
  <button class="btn" id="summaryBtn">集計</button>
  <button class="btn" id="settingsBtn">設定</button>
  <button class="btn primary" id="newBtn">＋ <span class="long">新しい案件</span><span class="short">新規</span></button>
</header>
<div class="layout">
  <div class="pane pane-left" id="left"></div>
  <div class="pane pane-right" id="right"></div>
</div>
<datalist id="workerList"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="auth" id="auth"><div class="auth-card" id="authCard"><p>読み込み中…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const ROLES = {normal:'通常', lead:'研修同行', trainee:'研修生'};
const STATUS = ['未手配','手配済','完了','入金済'];
const MEMO_ITEMS = [
  ['property','物件名・部屋'],['address','住所'],['key','鍵情報'],['pay','支払額'],
  ['hours','作業可能時間'],['parking','駐車場'],['content','工事内容'],['wnotes','作業員向けメモ'],['contacted','連絡済み']
];
const WEEK = ['日','月','火','水','木','金','土'];
const COPY_ITEMS = [
  ['date','施工日', j => { const d = fmtDateLong(j.date); return d ? d + (j.time ? ' ' + j.time.replace(/^0/,'') : '') : ''; }],
  ['client','発注元', j => { const c = data.settings.clients.find(x => x.short === j.client); return c ? c.name : j.client; }],
  ['orderNo','発注番号', j => j.orderNo],
  ['property','物件名・部屋', j => j.property + (j.room ? '　' + j.room : '')],
  ['address','住所', j => j.address],
  ['layout','間取り・面積', j => [j.layout, j.area ? j.area + '㎡' : ''].filter(Boolean).join(' ')],
  ['key','鍵情報', j => j.key],
  ['period','作業期間', j => (j.periodStart || j.periodEnd) ? `${fmtDateLong(j.periodStart) || ''}〜${fmtDateLong(j.periodEnd) || ''}` : ''],
  ['hours','作業可能時間', j => j.hours],
  ['parking','駐車場', j => j.parking],
  ['content','工事内容', j => j.content],
  ['cnotes','元請けからの注意事項', j => j.cnotes],
  ['report','写真・報告のルール', j => j.report],
  ['workers','担当作業員', j => j.workers.map(w => w.name + (w.role === 'trainee' ? '（研修）' : '')).filter(n => n && n !== '（研修）').join('・')],
  ['pay','作業員への支払額', j => payLine(j)],
  ['wnotes','作業員向けメモ', j => j.wnotes],
  ['dropbox','Dropboxのリンク', j => j.dropbox],
  ['status','状態', j => j.status],
  ['received','受注金額', j => j.received === '' ? '' : yen(j.received), true],
  ['expenses','経費・材料費', j => j.expenses === '' ? '' : yen(j.expenses), true],
  ['parkingFee','駐車場代', j => j.parkingFee === '' ? '' : yen(j.parkingFee), true],
  ['profit','粗利', j => j.received === '' ? '' : yen(profit(j)), true]
];
function presetText(p, j){
  return COPY_ITEMS.filter(([k]) => p.items[k]).map(([k, label, fn]) => {
    const v = String(fn(j) || '').trim();
    if(!v) return '';
    return p.labels ? `${label}：${v.includes('\n') ? '\n' + v : v}` : v;
  }).filter(Boolean).join('\n');
}
function fmtDateLong(d){
  if(!d) return '';
  const [y,mo,da] = d.split('-').map(Number);
  return `${mo}月${da}日(${WEEK[new Date(y, mo-1, da).getDay()]})`;
}

let data = defaultData();
let currentId = null;
let filter = 'すべて';
const SUPABASE_URL = 'https://rriresvxisvdotdeqezs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BFrE93O1Z9F0ym80vISAUw_DaHsl_ru';
const BUCKET = 'order-pdfs';
let sb = null, companyId = null, companyName = '', userEmail = '';
let pdf = null;          // 編集中の発注書PDF {name, blob, dirty}
let pdfUrl = null;
let sumMonth = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })();
let sumWorker = null;
let sumDoneOnly = false;
const PDF_MAX = 10 * 1024 * 1024;

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); })); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function yen(n){ return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
function num(v){ if(v === '' || v == null) return 0; const n = Number(String(v).replace(/[^\d.-]/g,'')); return isNaN(n) ? 0 : n; }

function defaultData(){
  return {
    settings:{
      workers:[],
      clients:[{name:'リロン・クリエイティブズーム',short:'リロン'},{name:'プレステージプランニング',short:'プレステージ'}],
      trainingFee:5000,
      memo:{property:true,address:true,key:true,pay:true,hours:false,parking:false,content:false,wnotes:false,contacted:true},
      issuer:{name:'',zip:'',address:'',tel:'',fax:'',invoice:''},
      payRule:{months:2, day:10},
      statements:{},
      presets:[{id:'p1',name:'LINE用',labels:true,items:{date:true,property:true,address:true,key:true,hours:true,parking:true,content:true}}]
    },
    jobs:[]
  };
}

function blankJob(){
  return {id:null,client:'',orderNo:'',property:'',room:'',address:'',layout:'',area:'',key:'',periodStart:'',periodEnd:'',hours:'',parking:'',content:'',cnotes:'',report:'',received:'',date:'',time:'',workers:[{name:'',role:'normal',pay:'',contacted:false}],wnotes:'',pdfName:'',dropbox:'',expenses:'',parkingFee:'',status:'未手配'};
}

/* ---------- cloud (Supabase) ---------- */
async function loadAll(){
  const {data: mem, error} = await sb.from('members').select('company_id, role').limit(1);
  if(error) throw error;
  if(!mem.length) return false;
  companyId = mem[0].company_id;
  const {data: comp} = await sb.from('companies').select('name').eq('id', companyId).maybeSingle();
  companyName = comp ? comp.name : '';
  const {data: st, error: e2} = await sb.from('settings').select('data').eq('company_id', companyId).maybeSingle();
  if(e2) throw e2;
  const d = defaultData();
  data.settings = Object.assign(d.settings, (st && st.data) || {});
  if(!data.settings.presets) data.settings.presets = [];
  await loadJobs();
  return true;
}
async function loadJobs(){
  const {data: rows, error} = await sb.from('jobs').select('id, data').eq('company_id', companyId);
  if(error) throw error;
  data.jobs = rows.map(r => Object.assign(blankJob(), r.data || {}, {id: r.id}));
}
async function persist(){   // 設定を保存
  const {error} = await sb.from('settings').upsert({company_id: companyId, data: data.settings});
  if(error) toast('保存に失敗しました。通信状況を確認してください');
}
async function saveJobCloud(j){
  const {id, ...rest} = j;
  const {error} = await sb.from('jobs').upsert({id, company_id: companyId, work_date: j.date || null, status: j.status, data: rest});
  if(error) throw error;
}
async function deleteJobCloud(id){

/* ---------- login screen ---------- */
function showAuth(mode, msg = ''){
  const box = document.getElementById('auth');
  const card = document.getElementById('authCard');
  box.hidden = false;
  if(mode === 'loading'){ card.innerHTML = '<p>読み込み中…</p>'; return; }
  if(mode === 'login'){
    card.innerHTML = `<h2>案件管理</h2><p>ログインしてください</p>
      <label class="f">メールアドレス<input id="loginEmail" type="email" autocomplete="username"></label>
      <label class="f">パスワード<input id="loginPass" type="password" autocomplete="current-password"></label>
      <button class="btn primary" id="loginBtn">ログイン</button>
      <div class="auth-msg" id="authMsg">${esc(msg)}</div>`;
    const go = () => login();
    document.getElementById('loginBtn').onclick = go;
    document.getElementById('loginPass').onkeydown = e => { if(e.key === 'Enter') go(); };
  }
  if(mode === 'company'){
    card.innerHTML = `<h2>はじめに</h2><p>このシステムを使う会社の名前を入れてください（あとで変更できます）</p>
      <label class="f">会社名<input id="companyName" placeholder="例：株式会社〇〇"></label>
      <button class="btn primary" id="companyBtn">はじめる</button>
      <div class="auth-msg" id="authMsg">${esc(msg)}</div>`;
    document.getElementById('companyBtn').onclick = createCompany;
  }
}
function hideAuth(){ document.getElementById('auth').hidden = true; }
async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  if(!email || !password){ document.getElementById('authMsg').textContent = 'メールアドレスとパスワードを入れてください'; return; }
  btn.disabled = true; btn.textContent = 'ログイン中…';
  const {data: res, error} = await sb.auth.signInWithPassword({email, password});
  if(error){ btn.disabled = false; btn.textContent = 'ログイン'; document.getElementById('authMsg').textContent = 'メールアドレスかパスワードが違います'; return; }
  userEmail = res.user.email;
  start();
}
async function createCompany(){
  const name = document.getElementById('companyName').value.trim();
  if(!name){ document.getElementById('authMsg').textContent = '会社名を入れてください'; return; }
  const btn = document.getElementById('companyBtn');
  btn.disabled = true; btn.textContent = '準備中…';
  const {error} = await sb.rpc('create_company', {company_name: name});
  if(error){ btn.disabled = false; btn.textContent = 'はじめる'; document.getElementById('authMsg').textContent = '作成に失敗しました。もう一度お試しください'; return; }
  start();
}
async function start(){
  showAuth('loading');
  try{
    const ok = await loadAll();
    if(!ok){ showAuth('company'); return; }
    hideAuth(); refreshDatalist(); show('list');
  }catch(e){
    showAuth('login', '読み込みに失敗しました。通信状況を確認してもう一度ログインしてください');
  }
}
async function logout(){
  await sb.auth.signOut();
  data = defaultData(); companyId = null; companyName = ''; userEmail = ''; currentId = null;
  showAuth('login');
}
function exportAll(){
  const payload = {exportedAt: new Date().toISOString(), company: companyName, settings: data.settings, jobs: data.jobs};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `案件管理_バックアップ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;

/* ---------- money ---------- */
function workerPay(w){ return num(w.pay) + (w.role === 'lead' ? num(data.settings.trainingFee) : 0); }
function totalPay(j){ return j.workers.reduce((s,w) => s + workerPay(w), 0); }
function profit(j){ return num(j.received) - totalPay(j) - num(j.expenses) - num(j.parkingFee); }

/* ---------- TimeTree text ---------- */
function ttTitle(j){
  const names = j.workers.map(w => w.name.trim()).filter(Boolean).join('・');
  const client = j.client ? `[${j.client}]` : '';
  const room = j.room ? '　' + j.room : '';
  return `${names}${client}${j.property}${room}`;
}
function payLine(j){
  const paid = j.workers.filter(w => w.role !== 'trainee' && num(w.pay) > 0);
  if(!paid.length) return '';
  if(paid.length === 1){
    const w = paid[0];
    return `${yen(w.pay)}税込${w.role === 'lead' ? '＋研修' : ''}`;
  }
  return paid.map(w => `${w.name || '（未定）'} ${yen(w.pay)}税込${w.role === 'lead' ? '＋研修' : ''}`).join('\n');
}
function ttMemo(j){
  const m = data.settings.memo;
  const s1 = [], s3 = [];
  if(m.property && j.property) s1.push(j.property + (j.room ? '　' + j.room : ''));
  if(m.address && j.address) s1.push(j.address);
  if(m.key && j.key) s1.push(j.key);
  const s2 = m.pay ? payLine(j) : '';
  if(m.hours && j.hours) s3.push('作業時間：' + j.hours);
  if(m.parking && j.parking) s3.push(j.parking);
  if(m.content && j.content) s3.push('作業内容：' + j.content);
  if(m.wnotes && j.wnotes) s3.push(j.wnotes);
  let s4 = '';
  if(m.contacted){
    const c = j.workers.filter(w => w.contacted && w.name.trim()).map(w => w.name.trim());
    if(c.length) s4 = c.join('・') + '連絡済';
  }
  return [s1.join('\n'), s2, s3.join('\n'), s4].filter(Boolean).join('\n\n');
}

/* ---------- summary ---------- */
function sumRows(){
  const fee = num(data.settings.trainingFee);
  const rows = [];
  data.jobs.forEach(j => {
    if(!j.date || !j.date.startsWith(sumMonth)) return;
    if(sumDoneOnly && !['完了','入金済'].includes(j.status)) return;
    j.workers.forEach(w => {
      if(!w.name) return;
      const base = num(w.pay), extra = w.role === 'lead' ? fee : 0;
      rows.push({job:j, worker:w.name, role:w.role, base, extra, pay:base + extra});
    });
  });
  return rows.sort((a,b) => (a.job.date + (a.job.time || '')) < (b.job.date + (b.job.time || '')) ? -1 : 1);
}

function toTsv(t){ return t.map(r => r.map(c => String(c ?? '').replace(/[\t\n]/g,' ')).join('\t')).join('\n'); }
function toCsv(t){ return t.map(r => r.map(c => { const v = String(c ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(',')).join('\r\n'); }
function downloadCsv(t, name){
  try{
    const blob = new Blob(['\uFEFF' + toCsv(t)], {type:'text/csv'});

    a.href = URL.createObjectURL(blob); a.download = name;

}

/* ---------- payment statement ---------- */
function stmtKey(){ return sumWorker + '|' + sumMonth; }
function monthRange(){
  const [y,m] = sumMonth.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  return {y, m, last};
}
function defaultPayDate(){
  const {y, m} = monthRange();
  const r = data.settings.payRule || {months:2, day:10};
  const d = new Date(y, m - 1 + num(r.months), 1);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(num(r.day) || 10, lastDay));
  return isoDate(d);
}
function isoDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getDraft(){
  const st = data.settings.statements || (data.settings.statements = {});
  const key = stmtKey();
  if(st[key]) return st[key];
  const prevKey = Object.keys(st).filter(k => k.startsWith(sumWorker + '|')).sort().pop();
  const prev = prevKey ? st[prevKey] : null;
  return {
    fullName: prev ? prev.fullName : sumWorker,
    issueDate: isoDate(new Date()),
    payDate: defaultPayDate(),
    commission: {
      enabled: prev ? prev.commission.enabled : false,
      rows: prev ? prev.commission.rows.map(r => ({label:r.label, count:'', sales:''})) : [{label:'鍵交換',count:'',sales:''},{label:'仕上がり',count:'',sales:''}],
      expense: '',
      rate: prev ? prev.commission.rate : 60
    },
    misc: {amount:'', note: prev ? prev.misc.note : '諸経費は合計金額に合算しておりません。'}
  };
}
function readDraft(){
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const enabled = document.getElementById('st-comm') ? document.getElementById('st-comm').checked : false;
  const rows = [...document.querySelectorAll('.crow')].map(r => ({
    label: r.querySelector('[data-c=label]').value.trim(),
    count: r.querySelector('[data-c=count]').value,
    sales: r.querySelector('[data-c=sales]').value
  }));
  const prev = getDraft();
  const shown = enabled && !!document.getElementById('crows');
  return {
    fullName: g('st-name').trim(),
    issueDate: g('st-issue'),
    payDate: g('st-pay'),
    commission: {
      enabled,
      rows: shown ? rows : prev.commission.rows,
      expense: shown ? g('st-exp') : prev.commission.expense,
      rate: shown ? g('st-rate') : prev.commission.rate
    },
    misc: {amount: g('st-misc'), note: g('st-note')}
  };
}
function calcStatement(d){
  const rows = sumRows().filter(r => r.worker === sumWorker && r.pay > 0);
  const siteTotal = rows.reduce((s,r) => s + r.pay, 0);
  const c = d.commission;
  const salesTotal = c.rows.reduce((s,r) => s + num(r.sales), 0);
  const commAmt = c.enabled ? Math.max(0, Math.floor((salesTotal - num(c.expense)) * num(c.rate) / 100)) : 0;
  const total = siteTotal + commAmt;
  return {rows, siteTotal, salesTotal, commAmt, total, tax: Math.round(total * 10 / 110)};
}
function jpDate(iso, withYear = true){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return withYear ? `${y}年${m}月${d}日` : `${m}月${d}日`;
}

/* ---------- utils ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copy(text, tt = true){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(tt ? 'コピーしました。TimeTreeに貼り付けてください' : 'コピーしました');
}

async function sharePdf(){
  if(!pdf) return;
  try{
    const file = new File([pdf.blob], pdf.name, {type:'application/pdf'});
    if(!navigator.share || (navigator.canShare && !navigator.canShare({files:[file]}))){
      toast('この画面では共有メニューを開けません。公開版でお試しください');
      return;
    }
    await navigator.share({files:[file], title:pdf.name});
  }catch(e){
    if(e && e.name === 'AbortError') return; // 共有メニューを閉じただけ
    toast('この画面では共有メニューを開けません。公開版でお試しください');
  }
}

  if(t.id === 'stImage'){ await saveDraft(); saveSheetImage(); return; }
  if(t.id === 'addCrow'){ const d = readDraft(); d.commission.rows.push({label:'',count:'',sales:''}); data.settings.statements[stmtKey()] = d; renderStatement(); return; }
  if(t.dataset.delcrow !== undefined){ const d = readDraft(); d.commission.rows.splice(Number(t.dataset.delcrow),1); data.settings.statements[stmtKey()] = d; renderStatement(); await persist(); return; }
  if(t.id === 'sumBack'){ sumWorker = null; renderSummary(); return; }
  if(t.id === 'copyStatement') copy(statementText(), false);
  if(t.id === 'copyTsvAll') copy(toTsv(tableData(sumRows())), false);
  if(t.id === 'copyTsvOne') copy(toTsv(tableData(sumRows().filter(r => r.worker === sumWorker))), false);
  if(t.id === 'csvAll') downloadCsv(tableData(sumRows()), `支払い集計_${sumMonth}.csv`);
  if(t.id === 'csvOne') downloadCsv(tableData(sumRows().filter(r => r.worker === sumWorker)), `支払い明細_${sumWorker}_${sumMonth}.csv`);
  if(t.dataset.copypreset){
    const p = data.settings.presets.find(x => x.id === t.dataset.copypreset);
    const txt = p ? presetText(p, readForm()) : '';
    if(!txt){ toast('コピーする内容がまだありません'); return; }
    copy(txt, false);
  }
  if(t.id === 'pdfShare') sharePdf();
  if(t.id === 'pdfRemove'){ pdf = null; renderPdfArea(); }
  if(t.id === 'addWorker'){ const w = readWorkers(); w.push({name:'',role:'normal',pay:'',contacted:false}); renderWorkers(w); updatePreview(); }
  if(t.dataset.remove !== undefined){ const w = readWorkers(); w.splice(Number(t.dataset.remove),1); if(!w.length) w.push({name:'',role:'normal',pay:'',contacted:false}); renderWorkers(w); updatePreview(); }
  if(t.id === 'saveBtn'){
    const j = readForm();
    if(!j.property){ toast('物件名を入れてください'); document.getElementById('f-property').focus(); return; }
    j.id = currentId || uid();
    const prev = data.jobs.find(x => x.id === j.id);
    t.disabled = true; t.textContent = '保存中…';
    try{
      if(pdf && pdf.dirty){
        const {error} = await sb.storage.from(BUCKET).upload(pdfPath(j.id), pdf.blob, {upsert:true, contentType:'application/pdf'});
        if(error) throw error;
      }
      if(!pdf && prev && prev.pdfName){ await sb.storage.from(BUCKET).remove([pdfPath(j.id)]); }
      await saveJobCloud(j);
    }catch(e){
      t.disabled = false; t.textContent = '保存する';
      toast('保存に失敗しました。通信状況を確認してください'); return;
    }
    const i = data.jobs.findIndex(x => x.id === j.id);
    if(i >= 0) data.jobs[i] = j; else data.jobs.push(j);
    currentId = j.id;
    renderList(); renderEditor(); toast('保存しました');
  }
  if(t.id === 'delBtn'){
    if(!delArmed){ delArmed = true; t.textContent = 'もう一度押すと削除'; setTimeout(() => { delArmed = false; if(document.getElementById('delBtn')) document.getElementById('delBtn').textContent = '削除'; }, 3000); return; }
    delArmed = false;
    try{
      const target = data.jobs.find(x => x.id === currentId);
      await deleteJobCloud(currentId);
      if(target && target.pdfName) await sb.storage.from(BUCKET).remove([pdfPath(currentId)]);
    }catch(e){ toast('削除に失敗しました。通信状況を確認してください'); return; }
    data.jobs = data.jobs.filter(x => x.id !== currentId); currentId = null;
    toast('削除しました'); show('list');
  }
  if(t.id === 'exportBtn') exportAll();
  if(t.id === 'logoutBtn') logout();
  if(t.id === 'addWorkerSetting'){
    const v = document.getElementById('newWorker').value.trim();
    if(v && !data.settings.workers.includes(v)){ data.settings.workers.push(v); await persist(); refreshDatalist(); renderSettings(); }
  }
  if(t.dataset.delworker !== undefined){ data.settings.workers.splice(Number(t.dataset.delworker),1); await persist(); refreshDatalist(); renderSettings(); }
  if(t.id === 'addPreset'){
    data.settings.presets.push({id:uid(), name:'新しいパターン', labels:true, items:{property:true, address:true}});
    await persist(); renderSettings();
  }
  if(t.dataset.pdel){
    if(t.dataset.armed !== '1'){ t.dataset.armed = '1'; t.textContent = 'もう一度で削除'; setTimeout(() => { t.dataset.armed = ''; t.textContent = '削除'; }, 3000); return; }
    data.settings.presets = data.settings.presets.filter(p => p.id !== t.dataset.pdel);
    await persist(); renderSettings();
  }
  if(t.id === 'addClient'){
    const n = document.getElementById('newClientName').value.trim();
    const s = document.getElementById('newClientShort').value.trim() || n;
    if(n){ data.settings.clients.push({name:n, short:s}); await persist(); renderSettings(); }
  }
  if(t.dataset.delclient !== undefined){ data.settings.clients.splice(Number(t.dataset.delclient),1); await persist(); renderSettings(); }
});
document.getElementById('right').addEventListener('input', e => {
  if(document.getElementById('stmt')){ updateSheet(); return; }
  if(document.getElementById('editor')) updatePreview();
});
document.getElementById('right').addEventListener('change', async e => {
  const t = e.target;
  if(t.id === 'pdfInput' && t.files[0]){
    const f = t.files[0];
    if(f.size > PDF_MAX){ toast('PDFが大きすぎます（10MBまで）'); t.value = ''; return; }
    pdf = {name:f.name, blob:f, dirty:true}; renderPdfArea();
    return;
  }
  if(document.getElementById('stmt')){
    data.settings.statements = data.settings.statements || {};
    data.settings.statements[stmtKey()] = readDraft();
    if(t.id === 'st-comm'){ renderStatement(); }
    await persist(); return;
  }
  if(t.dataset.issuer){ data.settings.issuer = data.settings.issuer || {}; data.settings.issuer[t.dataset.issuer] = t.value.trim(); await persist(); return; }
  if(t.dataset.payrule){ data.settings.payRule = data.settings.payRule || {months:2, day:10}; data.settings.payRule[t.dataset.payrule] = num(t.value); await persist(); return; }
  if(t.dataset.k === 'pick'){
    const inp = t.closest('.wrow').querySelector('[data-k=name]');
    if(t.value === '__other'){ inp.hidden = false; inp.value = ''; inp.focus(); }
    else { inp.hidden = true; inp.value = t.value; }
    updatePreview(); return;
  }
  if(t.id === 'sumMonth'){ if(t.value){ sumMonth = t.value; renderSummary(); } return; }
  if(t.id === 'sumDone'){ sumDoneOnly = t.checked; renderSummary(); return; }
  if(t.dataset.pname){ const p = data.settings.presets.find(x => x.id === t.dataset.pname); if(p){ p.name = t.value.trim() || '名前なし'; await persist(); } }
  if(t.dataset.plabels){ const p = data.settings.presets.find(x => x.id === t.dataset.plabels); if(p){ p.labels = t.checked; await persist(); } }
  if(t.dataset.pitem){ const [id,k] = t.dataset.pitem.split(':'); const p = data.settings.presets.find(x => x.id === id); if(p){ p.items[k] = t.checked; await persist(); } }
  if(t.dataset.memo){ data.settings.memo[t.dataset.memo] = t.checked; await persist(); }
  if(t.id === 'trainingFee'){ data.settings.trainingFee = num(t.value); await persist(); }
  if(document.getElementById('editor')) updatePreview();
});

document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState !== 'visible' || !companyId) return;
  const v = document.body.className;
  if(v !== 'view-list' && v !== 'view-summary') return;   // 編集中は再読み込みしない
  try{ await loadJobs(); renderList(); if(v === 'view-summary') renderSummary(); }catch(e){}
});

(async () => {
  if(!window.supabase){ showAuth('login', '読み込みに失敗しました。通信状況を確認して再読み込みしてください'); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const {data: {session}} = await sb.auth.getSession();
  if(session){ userEmail = session.user.email; start(); }
  else showAuth('login');
})();
</script>
